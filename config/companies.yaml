# Company watchlist. Each entry is fetched directly from its ATS public API on every scan.
# ats: greenhouse | lever | ashby | smartrecruiters | workday | eightfold
# token: Greenhouse board token / Lever site / Ashby job-board name /
#        SmartRecruiters companyIdentifier / Eightfold ?domain= value
# host:  Eightfold career-site host, e.g. apply.careers.microsoft.com
# location: Eightfold location filter, e.g. India
# aliases: other names the company appears under (LinkedIn export, alert emails), lower-case
# domains: sender domains for inbox matching
# Boards below were verified live on 2026-09-08. Add your own; unknown tokens fail softly and are logged.
dotnet_search_terms: &dotnet_search_terms ["C#", ".NET", "ASP.NET"]
last_expansion_verified: "2026-09-10"

companies:
  # Eightfold (PCSX) API: /api/pcsx/search?domain=&query=&location=&start=
  # Microsoft moved off jobs.careers.microsoft.com; that host is a JS shell with no data.
  - name: Microsoft
    ats: eightfold
    token: microsoft.com
    host: apply.careers.microsoft.com
    location: null
    search_terms: *dotnet_search_terms
    aliases: [msft, microsoft india, microsoft corporation]
    domains: [microsoft.com]
